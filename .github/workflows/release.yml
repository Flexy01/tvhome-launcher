name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  # One group per tag: at most one run publishes a tag at a time, so two builds
  # of the same tag never race for the same release.
  group: release-${{ github.ref_name || github.ref }}
  # GitHub replaces the pending run of a group by default, which would silently
  # discard queued publication requests. queue: max keeps every pending request
  # GitHub supports (up to 100 per group). It cannot be combined with
  # cancel-in-progress: true.
  queue: max
  # A publication that is already running must never be cancelled mid-flight.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed release APK
        working-directory: launcher
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PrequireReleaseSigning=true
      - name: Verify signature and APK size budget
        run: |
          APK="launcher/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: Expected signed app-release.apk, but file does not exist." >&2
            exit 1
          fi
          # Verify signature with Android SDK apksigner
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          # Verify size is under 2 MiB (2097152 bytes)
          size=$(stat -c %s "$APK")
          echo "Release APK size: $((size / 1024)) KB ($size bytes)"
          test "$size" -gt 0 || { echo "ERROR: APK is empty (0 bytes)!"; exit 1; }
          test "$size" -lt 2097152 || { echo "ERROR: APK exceeds 2 MiB budget!"; exit 1; }
          # Copy to publication asset name and calculate SHA-256 digest
          cp "$APK" tvhome-launcher.apk
          echo "Release APK SHA-256: $(sha256sum tvhome-launcher.apk | awk '{print $1}')"
      - name: Publish APK to GitHub Release
        # Only a tag ref publishes. Re-running this workflow with the tag
        # selected (workflow_dispatch) is the recovery path for a publication
        # that was interrupted; the script converges onto one verified asset.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x tools/publish_release.sh
          tools/publish_release.sh "${{ github.ref_name }}" tvhome-launcher.apk
      - name: Securely wipe ephemeral keystore
        if: always()
        run: |
          rm -f launcher/app/build/intermediates/signing/release.keystore
